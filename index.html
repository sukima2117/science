<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="小学4年 理科のおさらい。34枚のスライドを1枚ずつ表示します。">
  <title>理科のおさらい｜34枚のスライド</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body { background: #101820; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
    button, select { font: inherit; }
    #player { height: 100vh; height: 100dvh; display: grid; grid-template-rows: minmax(0, 1fr) auto; background: #101820; }
    #stage { position: relative; min-width: 0; min-height: 0; display: grid; place-items: center; overflow: hidden; touch-action: pan-y pinch-zoom; cursor: pointer; }
    #slide { display: block; width: 100%; height: 100%; object-fit: contain; min-height: 0; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; }
    #error { position: absolute; margin: 24px; max-width: 620px; padding: 24px; background: #172f40; color: #fff; border-radius: 12px; font-size: 18px; line-height: 1.8; }
    [hidden] { display: none !important; }
    .controls { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 12px; padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom)); border-top: 1px solid #354653; background: #18242f; }
    button, select { min-height: 44px; padding: 10px 18px; border: 1px solid #6a7a88; border-radius: 8px; background: #243443; color: #fff; font-weight: 600; cursor: pointer; }
    button:hover:not(:disabled), select:hover { background: #354e62; }
    button:focus-visible, select:focus-visible { outline: 3px solid #ffd770; outline-offset: 3px; }
    button:disabled { opacity: .35; cursor: default; }
    #next { color: #172e3d; background: #f7fafc; border-color: #f7fafc; }
    #next:hover:not(:disabled) { background: #dbeaf3; }
    #counter { min-width: 6ch; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; }
    #page { padding: 10px; max-width: 100px; }
    .hint { color: #bfcbd5; font-size: 13px; margin-left: 4px; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 600px) {
      .controls { gap: 8px; padding: 10px 8px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
      button { padding: 10px 12px; font-size: 14px; }
      #page { font-size: 14px; max-width: 86px; }
      #counter { font-size: 14px; }
      .hint { display: none; }
    }
    @media (max-height: 500px) {
      .controls { padding-top: 6px; padding-bottom: max(6px, env(safe-area-inset-bottom)); }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <div id="player">
    <main id="stage" aria-label="理科のスライド。クリックで次へ進みます。">
      <img id="slide" src="./slides/slide-01.png" alt="理科のおさらい 1枚目" draggable="false" fetchpriority="high">
      <p id="error" role="alert" hidden></p>
    </main>
    <nav class="controls" aria-label="スライドの操作">
      <button id="prev" type="button" aria-label="前のスライドへ" disabled>前へ</button>
      <span id="counter" role="status" aria-live="polite" aria-atomic="true">1 / 34</span>
      <button id="next" type="button" aria-label="次のスライドへ">次へ</button>
      <label class="visually-hidden" for="page">表示するページ</label>
      <select id="page" aria-label="表示するページ"></select>
      <button id="fullscreen" type="button">全画面</button>
      <span class="hint">画像をクリック・左右キーで移動</span>
    </nav>
  </div>
  <noscript>スライドの切り替えには、ブラウザーのJavaScriptを有効にしてください。</noscript>
  <script>
    (() => {
      "use strict";
      const TOTAL = 34;
      let current = 0;
      let pointerStart = null;
      let ignoreClickUntil = 0;
      const player = document.getElementById("player");
      const stage = document.getElementById("stage");
      const slide = document.getElementById("slide");
      const prev = document.getElementById("prev");
      const next = document.getElementById("next");
      const page = document.getElementById("page");
      const counter = document.getElementById("counter");
      const fullscreen = document.getElementById("fullscreen");
      const error = document.getElementById("error");
      const imagePath = n => `./slides/slide-${String(n + 1).padStart(2, "0")}.png`;
      const prefetched = new Set();

      for (let i = 0; i < TOTAL; i++) {
        const option = document.createElement("option");
        option.value = String(i);
        option.textContent = `${i + 1}枚目`;
        page.appendChild(option);
      }

      function preload(n) {
        if (n < 0 || n >= TOTAL || prefetched.has(n)) return;
        prefetched.add(n);
        const image = new Image();
        image.src = imagePath(n);
      }

      function show(n) {
        n = Math.max(0, Math.min(TOTAL - 1, n));
        if (n === current) return;
        current = n;
        error.hidden = true;
        slide.src = imagePath(current);
        slide.alt = `理科のおさらい ${current + 1}枚目`;
        counter.textContent = `${current + 1} / ${TOTAL}`;
        page.value = String(current);
        prev.disabled = current === 0;
        next.disabled = current === TOTAL - 1;
        preload(current + 1);
        preload(current - 1);
      }

      function showImageError() {
        error.textContent = `画像を表示できません。index.htmlと同じ場所にslidesフォルダーがあり、その中にslide-${String(current + 1).padStart(2, "0")}.pngが入っているか確認してください。`;
        error.hidden = false;
      }
      slide.addEventListener("error", showImageError);
      slide.addEventListener("load", () => { error.hidden = true; });
      if (slide.complete && !slide.naturalWidth) showImageError();

      prev.addEventListener("click", () => show(current - 1));
      next.addEventListener("click", () => show(current + 1));
      page.addEventListener("change", () => show(Number(page.value)));
      stage.addEventListener("click", () => {
        if (Date.now() >= ignoreClickUntil) show(current + 1);
      });
      stage.addEventListener("pointerdown", event => {
        pointerStart = { x: event.clientX, y: event.clientY };
      });
      stage.addEventListener("pointercancel", () => { pointerStart = null; });
      stage.addEventListener("pointerup", event => {
        if (!pointerStart) return;
        const dx = event.clientX - pointerStart.x;
        const dy = event.clientY - pointerStart.y;
        pointerStart = null;
        if (Math.abs(dx) >= 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
          ignoreClickUntil = Date.now() + 500;
          show(current + (dx < 0 ? 1 : -1));
        }
      });
      document.addEventListener("keydown", event => {
        if (event.altKey || event.ctrlKey || event.metaKey || event.repeat) return;
        if (event.target.closest("input, textarea, select, [contenteditable='true']")) return;
        if ((event.key === " " || event.key === "Enter") && event.target.closest("button")) return;
        if (["ArrowRight", "PageDown", " ", "Enter"].includes(event.key)) {
          event.preventDefault(); show(current + 1);
        } else if (["ArrowLeft", "PageUp"].includes(event.key)) {
          event.preventDefault(); show(current - 1);
        } else if (event.key === "Home") {
          event.preventDefault(); show(0);
        } else if (event.key === "End") {
          event.preventDefault(); show(TOTAL - 1);
        }
      });

      const isFullscreen = () => Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      const updateFullscreen = () => { fullscreen.textContent = isFullscreen() ? "全画面を終了" : "全画面"; };
      if (!player.requestFullscreen && !player.webkitRequestFullscreen) fullscreen.hidden = true;
      fullscreen.addEventListener("click", async () => {
        try {
          if (isFullscreen()) {
            if (document.exitFullscreen) await document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          } else {
            if (player.requestFullscreen) await player.requestFullscreen();
            else if (player.webkitRequestFullscreen) player.webkitRequestFullscreen();
          }
        } catch (_) {
          fullscreen.textContent = "全画面は利用できません";
        }
      });
      document.addEventListener("fullscreenchange", updateFullscreen);
      document.addEventListener("webkitfullscreenchange", updateFullscreen);
      preload(1);
    })();
  </script>
</body>
</html>
